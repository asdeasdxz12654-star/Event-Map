name: Test

# 푸시할 때마다 테스트와 린트를 돌린다.
#
# 왜 필요한가
#   지금까지 모든 검증을 손으로 했다. 그래서 회귀가 실제로 두 번 났다 —
#   promote_event_draft() 트리거가 구버전으로 되돌아간 것, 그리고 이미 있던 SPA 폴백을
#   못 보고 같은 일을 하는 플러그인을 하나 더 만든 것. 둘 다 화면상으로는 아무 차이가
#   없어서 눈으로는 안 잡혔다.
#
# 여기서 도는 것은 순수 함수뿐이다(탭 병합·이미지 자르기·페이징·미리보기·사이트맵).
# DB나 브라우저가 필요한 것은 돌리지 않는다 — 비밀키 없이 돌아야 포크에서도 돌고,
# 느려지면 아무도 안 보게 된다.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      # 빌드가 깨지는 것도 여기서 잡는다. GITHUB_PAGES=true로 돌려야
      # 404.html 폴백 단계까지 실제로 실행된다(deploy.yml과 같은 경로).
      - name: 빌드
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
