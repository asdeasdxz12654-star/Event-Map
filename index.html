<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- viewport-fit=cover가 있어야 iOS에서 env(safe-area-inset-*)이 실제 값을 갖는다.
         이게 없으면 아이폰 하단 홈 인디케이터 영역에 고정 예매 바가 깔려버린다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />

    <!-- 저장해 둔 화면 테마(다크/라이트)를 첫 그리기 전에 입힌다.
         React가 뜬 뒤에 입히면 라이트를 쓰는 사람에게 다크 화면이 한 번 번쩍인다.
         CSP(script-src 'self')상 인라인 스크립트를 못 써서 파일로 뒀다. -->
    <script src="/theme-init.js"></script>
    <meta name="description" content="국내 게임·코스프레·게임음악·일러스트 행사 통합 정보 플랫폼" />
    <title>게임이벤트허브</title>

    <!-- 본문 서체(Pretendard). 지금까지 CSS에 이름만 적어두고 실제로 불러오지는 않아서,
         Pretendard가 깔려 있지 않은 기기(=대부분)에서는 시스템 폰트로 대체되고 있었다.
         한글은 자소가 많아 통째로 받으면 무거우므로, 페이지에 실제로 쓰인 글자에 해당하는
         조각만 내려받는 dynamic subset을 쓴다(font-display: swap 포함).
         이 CDN은 public/_headers의 CSP(style-src/font-src)에도 함께 등록해야 한다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!-- iOS 사파리는 웹앱 매니페스트의 display/이름을 안 보고 아래 메타를 본다.
         홈 화면에 추가했을 때 주소창 없는 앱처럼 뜨게 하는 설정. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="이벤트허브" />

    <!-- 정적 SPA라 카카오톡·트위터 등 링크 미리보기 봇은 JS를 안 돌리고 이 태그들만 읽는다.
         여기 있는 값은 "사이트 전체를 공유했을 때"의 기본값이다.
         행사별 미리보기(/events/:id)는 Cloudflare Pages에서 functions/events/[id].js가
         이 태그들을 그 행사 값으로 바꿔서 내려준다 — 아래 태그를 지우거나 이름을 바꾸면
         그 함수의 선택자도 같이 고쳐야 한다.
         GitHub Pages 배포는 함수를 못 돌리므로 거기서는 이 기본값이 그대로 나간다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="게임이벤트허브" />
    <meta property="og:title" content="게임이벤트허브 — 국내 게임·코스프레·게임음악·일러스트 행사 정보" />
    <meta property="og:description" content="국내 게임·코스프레·게임음악·일러스트 행사 통합 정보 플랫폼" />
    <!-- %SITE_URL%은 빌드 시 배포 대상 도메인으로 치환된다 (vite.config.js의 siteUrlPlugin).
         GitHub Pages와 Cloudflare Pages에 같은 코드가 올라가므로 한쪽 도메인을 박아두면
         다른 쪽에서 공유했을 때 미리보기가 엉뚱한 사이트를 가리킨다. -->
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="게임이벤트허브" />
    <meta name="twitter:description" content="국내 게임·코스프레·게임음악·일러스트 행사 통합 정보 플랫폼" />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
