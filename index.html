<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- viewport-fit=cover가 있어야 iOS에서 env(safe-area-inset-*)이 실제 값을 갖는다.
         이게 없으면 아이폰 하단 홈 인디케이터 영역에 고정 예매 바가 깔려버린다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="국내 게임·코스프레·게임음악 행사 통합 정보 플랫폼" />
    <title>게임이벤트허브</title>

    <!-- iOS 사파리는 웹앱 매니페스트의 display/이름을 안 보고 아래 메타를 본다.
         홈 화면에 추가했을 때 주소창 없는 앱처럼 뜨게 하는 설정. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="이벤트허브" />

    <!-- 정적 SPA(GitHub Pages)라 카카오톡·트위터 등 링크 미리보기 봇은 JS를 안 돌리고
         이 태그들만 읽는다 — 그래서 "행사별" 미리보기는 서버 렌더링 없인 못 만들고,
         최소한 사이트 전체를 공유했을 때 제목/설명/이미지가 나오도록 기본값을 둔다.
         (individual event 공유는 document.title만 바뀔 뿐 og 태그는 그대로임 — 알려진 한계) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="게임이벤트허브" />
    <meta property="og:title" content="게임이벤트허브 — 국내 게임·코스프레·게임음악 행사 정보" />
    <meta property="og:description" content="국내 게임·코스프레·게임음악 행사 통합 정보 플랫폼" />
    <!-- %SITE_URL%은 빌드 시 배포 대상 도메인으로 치환된다 (vite.config.js의 siteUrlPlugin).
         GitHub Pages와 Cloudflare Pages에 같은 코드가 올라가므로 한쪽 도메인을 박아두면
         다른 쪽에서 공유했을 때 미리보기가 엉뚱한 사이트를 가리킨다. -->
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="게임이벤트허브" />
    <meta name="twitter:description" content="국내 게임·코스프레·게임음악 행사 통합 정보 플랫폼" />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
